services:
  wage-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - WAGE_OLLAMA_BASE_URL=${WAGE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wage-data:/app/data
    restart: unless-stopped

volumes:
  wage-data:
